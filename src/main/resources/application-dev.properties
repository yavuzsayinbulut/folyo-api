# Yalniz lokal gelistirme. Prod'da FOLYO_TOKEN_KEY ortam degiskeni verilmeden uygulama acilmaz.
folyo.token-key=${FOLYO_TOKEN_KEY}
# Mobil gelistirme: Expo Go (exp://) ve Expo web (localhost:8081) yonlendirmeleri + CORS.
folyo.mobile.redirect-prefixes=folyo://,exp://,http://localhost:8081/
folyo.cors.allowed-origins=http://localhost:8081
