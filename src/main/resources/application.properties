spring.application.name=folyo-api
server.port=8080
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30d

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true

# Lokal gelistirmede Postgres container'i uygulama kapaninca da ayakta kalsin
spring.docker.compose.lifecycle-management=start-only

# Giris sonrasi yonlendirilecek web adresi
folyo.web-url=http://localhost:3100

# Canli kartlar
folyo.media-dir=${user.home}/.folyo/media
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.threads.virtual.enabled=true
# Saglayici bilgileri ortam degiskeniyle verilir (README):
# FOLYO_TOKEN_KEY, FOLYO_GITHUB_TOKEN, FOLYO_LASTFM_API_KEY,
# FOLYO_REDDIT_CLIENT_ID/SECRET, FOLYO_SPOTIFY_CLIENT_ID/SECRET, FOLYO_STRAVA_CLIENT_ID/SECRET
